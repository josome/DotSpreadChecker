name: Package and release

# Release on every push to master whose .toc "## Version" has no tag yet.
# Bump the version in DotSpreadChecker.toc and push; the tag v<version>
# and the release with the packaged zip are created here.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag version from .toc
        id: version
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*//p' DotSpreadChecker.toc | tr -d '\r[:space:]')
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git tag "${tag}"
            git push origin "${tag}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: BigWigsMods/packager@v2
        if: steps.version.outputs.release == 'true'
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
