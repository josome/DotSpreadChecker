name: Package and release

# Release on every push to master whose .toc "## Version" has no release yet.
# Bump the version in DotSpreadChecker.toc and push; the tag v<version>
# and the release with the packaged zip are created here.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag version from .toc
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*//p' DotSpreadChecker.toc | tr -d '\r[:space:]')
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git tag "${tag}"
            git push origin "${tag}"
          fi
          git checkout -q "${tag}"
          echo "release=true" >> "$GITHUB_OUTPUT"

      # The packager action refuses to build a branch push whose commit is
      # tagged, so its script runs directly with the tag as the ref.
      - name: Package and upload
        if: steps.version.outputs.release == 'true'
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          GITHUB_REF="refs/tags/${TAG}" GITHUB_REF_NAME="${TAG}" GITHUB_REF_TYPE=tag \
            bash "$RUNNER_TEMP/release.sh"
